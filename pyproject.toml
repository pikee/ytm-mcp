[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytm-mcp"
version = "0.2.0"
description = "Read-only MCP server for the official Yandex Tag Manager API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.2.0",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ytm_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
